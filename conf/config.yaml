# Hydra 1.3+ config
seed: 42

trainer:
  accelerator: gpu
  devices: auto          # or an int, e.g., 2
  strategy: ddp
  precision: 16-mixed
  max_epochs: 5
  log_every_n_steps: 10
  deterministic: false
  num_nodes: 1
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  enable_progress_bar: true

data:
  dataset: MNIST
  root: ${oc.env:DATA_DIR, ./data}
  batch_size: 256
  num_workers: ${oc.env:NUM_WORKERS, 8}
  pin_memory: true
  val_split: 0.1
  download: false

model:
  in_channels: 1
  num_classes: 10
  lr: 3e-4
  weight_decay: 1e-4
  dropout: 0.1
  compile:
    enabled: false
    mode: reduce-overhead
    backend: inductor
  figures:
    log_confusion_matrix: true
    log_per_class_error: true
    log_misclassified_grid: true
    max_misclassified: 36

optimizer:
  _target_: torch.optim.AdamW
  lr: ${model.lr}
  weight_decay: ${model.weight_decay}

# set to null to disable scheduler
lr_scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  step_size: 3
  gamma: 0.5

# Use MLflow as the primary logger
logger:
  _target_: lightning.pytorch.loggers.MLFlowLogger
  experiment_name: "mnist"
  run_name: "run_${now:%Y%m%d_%H%M%S}"
  tracking_uri: ${oc.env:MLFLOW_TRACKING_URI, file:./mlruns}
  tags:
    project: "pl_hydra_mlflow_ddp"
  # requires mlflow >= 2.8.0; if older, just remove this flag
  synchronous: false

callbacks:
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val/loss
    mode: min
    save_top_k: 1
    filename: "epoch={epoch}-val_loss={val/loss:.3f}"
  - _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: step
  - _target_: lightning.pytorch.callbacks.RichProgressBar
