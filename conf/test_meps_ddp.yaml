_data_dir: ${oc.env:DATA_DIR,/home/users/u101329/p200177_t1_hp/u101329/npy_interp/}
_root_dir: ${oc.env:ROOT_DIR,/home/users/u101329/p200177_t2/u101329/diffusion-interp}
_mlflow_dir: ${oc.env:MLFLOW_DIR,/home/users/u101329/p200177_t2/u101329/_mlruns}
_work_dir: ${oc.env:WORK_DIR,${_root_dir}/_work2}
_checkpoints_dir: ${_work_dir}/checkpoints

resume_from_ckpt: none  # none, file, best or last
ckpt_path: ${_checkpoints_dir}/last.ckpt # if resume_from_ckpt=file

defaults:
  - trainer: ddp
  - datamodule: meps_npy
  - model: ddpm_attention
  - callbacks: default
  - logger: default
  - _self_

logger:
  run_name: "ddpm-npy-1-year_${now:%Y%m%d_%H%M%S}"
# Hydra 1.3+ config
seed: 42
sampler:
    _target_: samplers.heun_edm.HeunEDMSampler
    steps: 40
    sigma_min: 0.002
    sigma_max: 80.0
    rho: 7.0
    out_key: samples
    
