_data_dir: ${oc.env:DATA_DIR,/home/users/u101329/p200177_t2/DE_371/datasets/datasets_SMHI/npy_intep}


defaults:
  - trainer: ddp
  - datamodule: meps_npy
  - model: edm_interpolator
  - _self_


# Hydra 1.3+ config
seed: 42





   
# Use MLflow as the primary logger
logger:
  _target_: lightning.pytorch.loggers.MLFlowLogger
  experiment_name: "meps"
  run_name: "run_${now:%Y%m%d_%H%M%S}"
  tracking_uri: mlruns
  tags:
    project: "diffusion_interpolation"
  # requires mlflow >= 2.8.0; if older, just remove this flag
  synchronous: false


callbacks:
  - _target_: utils.GPUsAssignedCallback
  - _target_: utils.GPUMemoryMonitorCallback
    every_n_steps: 1
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val_loss
    mode: min
    save_top_k: 1
    save_last: true
    filename: "{epoch}-{val_loss:.3f}"
    dirpath: work
  - _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: step
  #- _target_: lightning.pytorch.callbacks.TQDMProgressBar
