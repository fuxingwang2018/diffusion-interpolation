
_target_: models.EDM

data_shape: ${data_shape}
sigma_data: 0.5
p_mean: 0.0
p_std: 1.0


#predict: x          # noise | x | velocity
#loss_weighting: snr     # mse | snr | rescaled_snr
#snr_gamma: 5.0          # only for snr



network_cfg:
  _target_: networks.UNet2D
  attn_resolutions: [8, 16]


sampler_cfg: ${sampler}
 

optimizer_cfg:
  _target_: torch.optim.Adam
  lr: 1e-4
  betas: [0.9, 0.999]
scheduler_cfg:
  _target_: torch.optim.lr_scheduler.ExponentialLR
  gamma: 0.9999



