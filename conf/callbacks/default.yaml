- _target_: callbacks.GPUsAssignedCallback


- _target_: callbacks.GPUMemoryMonitorCallback
  every_n_steps: 50

- _target_: callbacks.SampleOnValEndCallback
  every_n_epochs: 1
  save_npz: true
  out_dir: ${_work_dir}/samples
  max_plot_channels: 3

- _target_: lightning.pytorch.callbacks.ModelCheckpoint
  monitor: val_loss
  mode: min
  save_top_k: 3
  save_last: true
  filename: "{epoch}-{val_loss:.3f}"
  dirpath: ${_checkpoints_dir} 
- _target_: lightning.pytorch.callbacks.LearningRateMonitor
  logging_interval: step
#- _target_: lightning.pytorch.callbacks.TQDMProgressBar
