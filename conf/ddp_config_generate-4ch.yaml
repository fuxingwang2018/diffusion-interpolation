_data_dir: ${oc.env:DATA_DIR,/home/users/u101329/p200177_t1_hp/u101329/npy_interp/}
ckpt_file: /home/users/u101329/p200177_t2/u101329/diffusion-interp/_work/ddpm-npy-uvt-20250929_203652/checkpoints/last.ckpt
outdir: /home/users/u101329/p200177_t1_hp/u101329/results/samples_uvt

batches: -1  # -1 means all batches
device: specify
seed: 42

split: test # val, test, train

defaults:
  - model: ddpm_attention
  - sampler: heun_edm
  - _self_

number_of_channels: 4
datamodule:
  _target_: data.MEPSNPYSamplingWindowDataModule
  # --- Data sources ---
  root: ${_data_dir}/merged_samples
  sequences_csv: ${_data_dir}/sequences-2023-2024.csv

  # --- Optional filters (null = include all) ---
  members: [0]         # e.g. [0,1,2]
  leads: null           # e.g. [0,6,12,18,24,30,36]

  # --- Channels to load (0-based indices into file's C) ---
  file_channel_indices: [0, 1, 2, 3]   # e.g., u10, v10, t2m
 
  # --- IO / dtype ---
  dtype: float32
  mmap: true

  # --- Time window (inclusive); sorted chronologically in the dataset ---
  date_range: ["2024-10-22","2024-12-31"]

  # --- DataLoader (no shuffle) ---
  batch_size: 32
  num_workers: 32
  pin_memory: true
  # Normalization
  normalize: symrange                                    # none | zscore | symrange
  stats_npz: ${_data_dir}/sequences-stats-2023-2024.npz
  mean_key: mean
  std_key: std
  average_key: global_mean                        # if using symrange
  global_min_key: global_min
  global_max_key: global_max
  norm_const: 0.95


data_shape:
  x_shape: [2, 4, 256, 256]  # T, C, H, W or M, T, C, H, W if ensemble
  y_shape: [5, 4, 256, 256]  # T, C, H, W or M, T, C, H, W if ensemble

